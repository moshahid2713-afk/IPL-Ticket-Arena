
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>IPL TICKET ARENA</h1>
        <p>Book Your IPL Tickets</p>
    </header>

    <main>
        <h2>Ticket Booking Form</h2>
        <a href="index.html">← Back to Home</a>

<form action="#" method="get">

    <fieldset>
        <legend>Personal Details</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name"
               minlength="3" maxlength="50" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email"
               required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter 10-digit phone number"
               pattern="[0-9]{10}" maxlength="10" required>

    </fieldset>

    <fieldset>
        <legend>Ticket Details</legend>

        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">-- Select Match --</option>
            <option value="CSK vs RCB">CSK vs RCB</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="RCB vs SRH">RCB vs SRH</option>
            <option value="GT vs RR">GT vs RR</option>
        </select>

        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">-- Select Category --</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>

        <label for="quantity">Number of Tickets:</label>
        <input type="number" id="quantity" name="quantity"
               min="1" max="10" required>

    </fieldset>

    <fieldset>
        <legend>Booking Preferences</legend>

        <p>Payment Method:</p>

        <input type="radio" id="upi" name="payment"
               value="UPI" required>
        <label for="upi">UPI</label>

        <input type="radio" id="card" name="payment"
               value="Card">
        <label for="card">Card</label>

        <input type="radio" id="netbanking" name="payment"
               value="Net Banking">
        <label for="netbanking">Net Banking</label>

        <br><br>

        <input type="checkbox" id="terms" name="terms"
               value="accepted" required>
        <label for="terms">I agree to the booking terms and conditions.</label>

    </fieldset>



    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>


    </main>

    <footer>
        <p>© 2026 IPL Ticket Arena</p>
    </footer>

</body>
</html>
